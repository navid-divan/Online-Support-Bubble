[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osb"
version = "0.1.0"
description = "Online Support Bubble - a privacy-preserving support group mechanism"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "py_ecc==8.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
osb = "osb.cli.main:main"

[tool.setuptools.packages.find]
include = ["osb*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
